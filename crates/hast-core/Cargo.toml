[package]
name = "hast-core"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
slh-dsa = "0.1"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ml-kem = "0.2"
chacha20poly1305 = "0.10"
argon2 = "0.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
