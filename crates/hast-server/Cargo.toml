[package]
name = "hast-server"
version = "0.1.0"
edition = "2021"

[dependencies]
hast-core = { path = "../hast-core" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
argon2 = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
# passkeys (WebAuthn): signature checks for ES256, RS256 and Ed25519, and the CBOR the authenticator sends
ring = "0.17"
ciborium = "0.2"
base64 = "0.22"

[dev-dependencies]
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
